name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        type: boolean
        default: true
        required: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build MSI
        id: build
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: fleet-desktop-msi-v${{ steps.build.outputs.VERSION }}
          path: ${{ steps.build.outputs.MSI_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $tag = "v${{ steps.build.outputs.VERSION }}"
          }
          Write-Host "Tag: $tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "TAG=$tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSI_PATH: ${{ steps.build.outputs.MSI_PATH }}
          TAG: ${{ steps.tag.outputs.TAG }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          $args = @(
            "release", "create", $env:TAG,
            $env:MSI_PATH,
            "--title", "Fleet Desktop $env:TAG",
            "--generate-notes"
          )
          # workflow_dispatch supplies draft/prerelease inputs; tag pushes default to a non-draft release.
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:DRAFT -eq "true") { $args += "--draft" }
            if ($env:PRERELEASE -eq "true") { $args += "--prerelease" }
          }
          gh @args
