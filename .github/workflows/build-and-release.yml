name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create as draft release"
        type: boolean
        default: true
        required: false
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: false
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Signing credentials live only in this workflow — the per-push Build
      # workflow compiles without secrets so it stays fork-safe. sign.ps1
      # auto-detects Azure Trusted Signing first, then PFX; with neither
      # configured the MSI is released unsigned.
      - name: Build and sign MSI
        id: build
        shell: pwsh
        env:
          AZURE_TS_ENDPOINT: ${{ secrets.AZURE_TS_ENDPOINT }}
          AZURE_TS_ACCOUNT: ${{ secrets.AZURE_TS_ACCOUNT }}
          AZURE_TS_PROFILE: ${{ secrets.AZURE_TS_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: .\build.ps1 -Configuration Release

      - name: Upload MSI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fleet-desktop-msi-v${{ steps.build.outputs.VERSION }}
          path: ${{ steps.build.outputs.MSI_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          } else {
            $tag = "v${{ steps.build.outputs.VERSION }}"
          }
          Write-Host "Tag: $tag"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "TAG=$tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSI_PATH: ${{ steps.build.outputs.MSI_PATH }}
          TAG: ${{ steps.tag.outputs.TAG }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          $args = @(
            "release", "create", $env:TAG,
            $env:MSI_PATH,
            "--title", "Fleet Desktop $env:TAG",
            "--generate-notes"
          )
          # workflow_dispatch supplies draft/prerelease inputs; tag pushes default to a non-draft release.
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:DRAFT -eq "true") { $args += "--draft" }
            if ($env:PRERELEASE -eq "true") { $args += "--prerelease" }
          }
          gh @args
